<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deploy your Career (Copy)</title>
<!-- Versión integrada sobre 1791917974-4ea1: se conserva el cambio de título de esa versión y se corrige "postlaciones". -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior con pestañas, una columna de trabajo, ficha lateral para cada postulación */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#1E1E1E; --muted:#4C4C4C; --line:#E5E5E5; --soft:#ECECEC;
  --accent:#253FF6; --accent-ink:#FFFFFF; --lime:#DCF166; --lime-soft:#E9F299; --lime-ink:#1E1E1E;
  --ok:#17794E; --warn:#A86A00; --bad:#BB3A2B; --info:#0360FE;
  --f-display:'Exo 2','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Source Sans Pro','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 12px 40px rgba(30,30,30,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1E1E; --surface:#2A2A2A; --ink:#F5F5F5; --muted:#B8B8B8; --line:#4C4C4C; --soft:#333333;
  --accent:#6CAFFF; --accent-ink:#1E1E1E; --ok:#4CC38A; --warn:#E0A63A; --bad:#F07A6A; --info:#6CAFFF;
  --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1E1E; --surface:#2A2A2A; --ink:#F5F5F5; --muted:#B8B8B8; --line:#4C4C4C; --soft:#333333;
  --accent:#6CAFFF; --accent-ink:#1E1E1E; --ok:#4CC38A; --warn:#E0A63A; --bad:#F07A6A; --info:#6CAFFF;
  --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800}
h3{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 12px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font:800 21px var(--f-display);letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding-bottom:2px;flex:1 1 auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current="page"]{background:var(--lime);color:var(--lime-ink);font-weight:600}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:6px;opacity:.7}

/* piezas comunes */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.primary{font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px;margin-block:14px 16px}
.head p{margin:2px 0 0;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.in{resize:vertical;line-height:1.5}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0;background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent);color:var(--c,var(--muted));border:1px solid color-mix(in srgb,var(--c,var(--muted)) 30%,transparent)}
.ok{--c:var(--ok)} .warn{--c:var(--warn)} .bad{--c:var(--bad)} .info{--c:var(--info)} .neutral{--c:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:800 17px var(--f-display);margin-bottom:4px}

/* resumen */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font:800 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.hrow{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;margin-block:7px;font-size:13px}
.hrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.months{display:flex;align-items:end;gap:6px;height:140px;padding-top:8px;border-bottom:1px solid var(--line)}
.months>div{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;min-width:0}
.months i{width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.months i.cur{opacity:1}
.months em{font:500 11px var(--f-mono);font-style:normal;margin-bottom:3px}
.mlabels{display:flex;gap:6px;margin-top:4px}
.mlabels span{flex:1;text-align:center;font-size:11px;color:var(--muted)}

/* tabla */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:600}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--soft)}
tr:last-child td{border-bottom:0}
.pct{display:inline-block;min-width:52px;text-align:center;font:600 13px var(--f-mono);padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.co b{display:block;font-weight:600}
.co span{color:var(--muted);font-size:13px}
.st{border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:500;cursor:pointer;max-width:130px}
.st option{color:var(--ink);background:var(--surface)}

/* ficha */
.ov{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:var(--shadow);padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}
.dsec{margin-top:14px}
.dsec>h3{margin-bottom:8px}
details.panel{padding:0}
details.panel>summary{cursor:pointer;padding:12px 16px;font:600 15px var(--f-display);list-style:none}
details.panel>summary::after{content:"+";float:right;font-family:var(--f-mono)}
details[open].panel>summary::after{content:"–"}
details.panel>div{padding:0 16px 16px}

/* match */
.match{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 26px var(--f-display)}
.ring small{display:block;font:500 11px var(--f-body);color:var(--muted);text-align:center;margin-top:-14px}
.comps{flex:1 1 220px;min-width:0}
.comp{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.comp .mono{text-align:right}
.lbl{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 4px}

/* informe */
.report{line-height:1.6}
.report h3{margin:14px 0 4px;font-size:16px}
.report ul,.report ol{margin:4px 0 8px;padding-left:20px}
.report p{margin:6px 0}

/* búsqueda diaria */
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.dg{border-collapse:separate;border-spacing:0;min-width:0;width:max-content}
.dg th,.dg td{padding:0;border-bottom:1px solid var(--line);text-align:center}
.dg th{padding:8px 0;min-width:30px;font-size:10px}
.dg th.today{color:var(--accent);font-weight:600}
.dg td.name,.dg th.name{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:6px 12px;min-width:176px;border-right:1px solid var(--line)}
.dg td.name a{font-weight:500;text-decoration:none;color:var(--ink)}
.dg td.name a:hover{text-decoration:underline}
.cell{width:30px;height:32px;border:0;background:transparent;cursor:pointer;position:relative}
.cell::after{content:"";position:absolute;inset:8px;border-radius:5px;border:1.5px solid var(--line)}
.cell[aria-pressed="true"]::after{background:var(--ok);border-color:var(--ok)}
.cell.today::after{border-color:var(--accent)}
.cell.today[aria-pressed="true"]::after{border-color:var(--ok)}
.dg td.tot{min-width:52px;font:500 12px var(--f-mono);padding:0 8px;border-left:1px solid var(--line)}
.dg td.hoy{min-width:60px;padding:0 6px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-size:13px;max-width:calc(100% - 32px)}
.saved{font:500 12px var(--f-mono);color:var(--ok)}
@media (max-width:560px){.comp{grid-template-columns:96px 1fr 38px}.hrow{grid-template-columns:90px 1fr 24px}}
@media (prefers-reduced-motion:no-preference){.ring circle.v{transition:stroke-dasharray .5s ease}}
/* registros, indicadores y avisos */
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.ih{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}
.btn.small{padding:3px 10px;font-size:12px}
.fields .wide{grid-column:1/-1}
label.f.chk{justify-content:end}
label.f.chk span{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.nb{--c:var(--muted);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:13px}
.nb.info{--c:var(--info)} .nb.warn{--c:var(--warn)}
.tag{display:inline-block;font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.res{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.indrow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.indrow .meta{grid-column:1/-1}
.indrow input.meta{padding:5px 8px;font-size:12px}
.modrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.modrow input{margin-top:4px}
details.src summary{cursor:pointer;font-size:12px;color:var(--muted);margin-top:8px}
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);max-width:760px}
.kpi .tag{margin-top:6px}
</style>

  <header class="top">
    <div class="brand"><b>Deploy your Career</b><span id="who"></span></div>

<script>
(()=>{
'use strict';
/* ========= utilidades ========= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=iso(new Date());
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const rx=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y.slice(2)}`};

/* ========= datos ========= */
const KEY='radar-postulaciones-v1';
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const PLATS=[
 ['LinkedIn','https://www.linkedin.com/jobs/'],['Indeed','https://ar.indeed.com/'],
 ['Tecla','https://tecla.io/'],['Kala Talent','https://www.kalatalent.com/'],['Real Work From Anywhere','https://www.realworkfromanywhere.com/'],
 ['Interfell','https://interfell.com/'],['Get on Board','https://www.getonbrd.com/'],['Remotive','https://remotive.com/'],
 ['Wellfound','https://wellfound.com/jobs'],['Working Nomads','https://www.workingnomads.com/jobs'],['Himalayas','https://himalayas.app/jobs'],
 ['ZipRecruiter','https://www.ziprecruiter.com/'],['Remote Rocketship','https://www.remoterocketship.com/'],['Power to Fly','https://powertofly.com/jobs'],
 ['Torre.ai','https://torre.ai/'],['NoDesk','https://nodesk.co/remote-jobs/'],['Jobspresso','https://jobspresso.co/'],
 ['Jobgether','https://jobgether.com/'],['RemoteOK','https://remoteok.com/']
].map(([name,url])=>({id:slug(name),name,url}));
const ESTADOS=['Por postular','Postulado','En revisión','Entrevista','Prueba técnica','Oferta','Rechazado','Sin respuesta'];
const ECOLOR={'Por postular':'neutral','Postulado':'info','En revisión':'info','Entrevista':'warn','Prueba técnica':'warn','Oferta':'ok','Rechazado':'bad','Sin respuesta':'neutral'};
const EN_PROCESO=['En revisión','Entrevista','Prueba técnica'];
const SIN_RESPUESTA=['Por postular','Postulado','Sin respuesta'];
const EXTRA_FUENTES=['Referido','Web de la empresa','Otra'];

const blank=()=>({
  profile:{name:'',nameAuto:true,shareName:false,headline:'',years:'',english:'',extraSkills:'',cv:''},
  apps:[],platforms:PLATS,checks:{},goal:0,goalSet:false,draft:{empresa:'',puesto:'',link:'',fuente:'',estado:'Postulado',jd:''},
  mods:{valores:false,marca:false,empleadores:false,seguimiento:false,informativas:false,experimentos:false,visibilidad:false,ia:false},
  objetivos:[],contactos:[],red:[],posts:[],tiempos:[],revisiones:[],empleadores:[],experimentos:[],metricas:[],descansos:[],metas:{},
  base:{activos:'',aspiraciones:'',mercado:'',sintesis:'',objetivoLaboral:''},
  marca:{promesa:'',audiencia:'',historia:'',titular:''},revFreq:'',planVars:{}
});
let state=blank();
const LISTAS=['objetivos','contactos','red','posts','tiempos','revisiones','empleadores','experimentos','metricas','descansos'];
function hydrate(x){
  state=Object.assign(blank(),x);
  state.profile=Object.assign(blank().profile,x.profile||{});
  if(x.profile&&x.profile.nameAuto===undefined&&x.profile.name&&x.profile.name!=='Iván Gonzalez')state.profile.nameAuto=false;
  state.draft=Object.assign(blank().draft,x.draft||{});
  state.mods=Object.assign(blank().mods,x.mods||{});
  state.base=Object.assign(blank().base,x.base||{});
  state.marca=Object.assign(blank().marca,x.marca||{});
  if(!x.goalSet)state.goal=0;
  LISTAS.forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
  if(!state.metas||typeof state.metas!=='object')state.metas={};
  if(!state.planVars||typeof state.planVars!=='object')state.planVars={};
  delete state.emociones;
  state.objetivos.forEach(o=>{if(!o.periodo){o.periodo='Mensual';o.mes=(o.plazo||TODAY).slice(0,7);o.semana=''}});
  if(!Array.isArray(state.apps))state.apps=[];
  state.apps.forEach(a=>{a.entrevistas=a.entrevistas||[]});
}
function load(){try{const r=localStorage.getItem(KEY);if(r)hydrate(JSON.parse(r))}catch(e){}}
const saveNow=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const persist=debounce(saveNow,250);
/* El nombre sale del CV: se toma la primera línea que parezca un nombre propio */
function guessName(cv){
  const lines=String(cv||'').split('\n').map(l=>l.replace(/^[#*\s_>\-]+|[*_\s]+$/g,'').trim()).filter(Boolean).slice(0,6);
  for(const l of lines){
    if(l.length<4||l.length>60||/[\d@:/|•●]|https?|www\./i.test(l))continue;
    const w=l.split(/\s+/);if(w.length<2||w.length>5)continue;
    if(/(curriculum|vitae|\bcv\b|perfil|resumen|experiencia|educaci|desarrollador|developer|engineer|ingenier)/i.test(l))continue;
    if(w.every(x=>/^[A-ZÁÉÍÓÚÑÜ]/.test(x)||/^(de|del|la|las|los|da|das|do|dos|van|von|y)$/i.test(x))){
      return w.map(x=>x===x.toUpperCase()&&x.length>2?x[0]+x.slice(1).toLowerCase():x).join(' ')}
  }
  return''}
function syncName(){const p=state.profile;
  if(p.name==='Iván Gonzalez'&&p.nameAuto!==false){p.name='';p.nameAuto=true}   // nombre de ejemplo de versiones anteriores
  if(p.nameAuto!==false){const g=guessName(p.cv);if(g||!p.cv)p.name=g}}
load();syncName();

const ui={editPl:null,delPl:null,vista:(()=>{try{return sessionStorage.getItem('radar-vista')==='app'?'app':'landing'}catch(e){return'landing'}})(),pais:'Argentina',planWeek:null,tab:'resumen',filter:'Todos',q:'',sort:'fecha',openId:null,confirmDel:false,month:TODAY.slice(0,7),busy:null,confirmR:null,sub:'tiempo',aiAsk:null};
const cap={sample:null,downloads:null};

/* ========= semana, período y resúmenes ========= */
const parseD=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const x=parseD(s);x.setDate(x.getDate()+n);return iso(x)};

const minTxt=m=>{m=Math.round(m||0);return m>=60?`${Math.floor(m/60)} h${m%60?' '+m%60+' min':''}`:`${m} min`};

const fOpts=(f,it)=>typeof f.o==='function'?f.o(it):f.o;
function fieldHTML(rk,it,f){
  if(f.mod&&!state.mods[f.mod])return'';
  if(f.show&&!f.show(it))return'';
  const b=`data-r="${rk}" data-id="${it.id}" data-f="${f.k}"`,v=it[f.k];
  if(f.t==='s'){let o=fOpts(f,it).slice();if(v&&!o.includes(v))o.unshift(v);return`<label class="f">${f.l}<select class="in" ${b}>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
  if(f.t==='a')return`<label class="f wide">${f.l}<textarea class="in" rows="2" ${b} placeholder="${esc(f.p||'')}">${esc(v)}</textarea></label>`;
  if(f.t==='c')return`<label class="f chk"><span><input type="checkbox" ${b} ${v?'checked':''}> ${f.l}</span></label>`;
  return`<label class="f">${f.l}<input class="in" type="${f.t==='d'?'date':f.t==='m'?'month':f.t==='n'?'number':'text'}" ${f.t==='n'?'min="0"':''} ${b} value="${esc(v)}" placeholder="${esc(f.p||'')}"></label>`}
function regList(rk,flt,emp){
  const R=REG[rk],L=state[rk].filter(flt||(()=>true));
  if(R.sort)L.sort(R.sort);else if(L.length&&L[0].fecha!==undefined)L.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  if(!L.length){const E=emp||R.empty;return`<div class="empty"><b>${E[0]}</b>${E[1]}</div>`}
  return L.map(it=>`<div class="item"><div class="ih"><div style="min-width:0"><b>${esc(R.title(it))}</b><div class="small muted">${esc(R.sub?R.sub(it):'')}</div></div>${ui.confirmR===rk+it.id?`<span class="row"><button class="btn danger small" data-act="rdelYes" data-r="${rk}" data-id="${it.id}">Eliminar</button><button class="btn small" data-act="rdelNo">Cancelar</button></span>`:`<button class="btn ghost small" data-act="rdelAsk" data-r="${rk}" data-id="${it.id}">Eliminar</button>`}</div><div class="fields">${R.f.map(f=>fieldHTML(rk,it,f)).join('')}</div>${R.extra?R.extra(it):''}</div>`).join('')}

function md(src){
  const L=esc(src).split('\n'),out=[];let list=null;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const raw of L){const l=raw.trim();let m;
    if(!l){close();continue}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){close();out.push(`<h3>${inl(m[2])}</h3>`)}
    else if((m=l.match(/^[-*•●]\s+(.*)/))){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push(`<li>${inl(m[1])}</li>`)}
    else if((m=l.match(/^\d+[.)]\s+(.*)/))){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push(`<li>${inl(m[1])}</li>`)}
    else if(/^-{3,}$/.test(l)){close()}
    else{close();out.push(`<p>${inl(l)}</p>`)}}
  close();return out.join('')}

  const n=M.length,eng=M.filter(a=>a.match.eng&&a.match.eng.req>0),lv=[1,2,3].map(i=>[ENG_TXT[i],eng.filter(a=>a.match.eng.req===i).length]);
  const okEng=eng.filter(a=>a.match.eng.status==='Cumple').length;
  const miss={},have={};
  M.forEach(a=>{a.match.hardX.concat(a.match.softX).forEach(k=>miss[k]=(miss[k]||0)+1);a.match.hardM.concat(a.match.softM).forEach(k=>have[k]=(have[k]||0)+1)});
  const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,15),tmx=Math.max(1,...top.map(x=>x[1]));
  const req=Object.entries(Object.keys(miss).concat(Object.keys(have)).reduce((o,k)=>(o[k]=(miss[k]||0)+(have[k]||0),o),{})).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const prom=Math.round(M.reduce((t,a)=>t+a.match.pct,0)/n);
  return`<div class="head"><div><h2>Análisis</h2><p>Sobre ${n} ofertas con descripción${sinJd?` · ${sinJd} sin descripción no cuentan`:''}.</p></div></div>

   <div class="kpi"><div class="v">${top.length?esc(top[0][0]):'—'}</div><div class="l">Skill que más te falta</div></div>
   <div class="kpi"><div class="v">${prom}%</div><div class="l">Match promedio</div></div>
  </div>

   <div class="panel"><h3>Nivel de inglés pedido</h3><p class="small muted" style="margin:2px 0 8px">Sobre las ${eng.length} ofertas que lo piden</p>${lv.map(([l,c])=>`<div class="hrow"><span>${l}</span><div class="bar"><i style="width:${eng.length?c/eng.length*100:0}%"></i></div><span class="mono">${c}</span></div>`).join('')}
     <div class="hrow"><span>No piden</span><div class="bar" style="--c:var(--muted)"><i style="width:${(n-eng.length)/n*100}%"></i></div><span class="mono">${n-eng.length}</span></div></div>
   <div class="panel"><h3>Herramientas que más te faltan</h3><p class="small muted" style="margin:2px 0 8px">En cuántas ofertas aparecen y no están en tu CV</p>${top.length?top.map(([k,c])=>`<div class="hrow"><span title="${esc(k)}">${esc(k)}</span><div class="bar" style="--c:var(--bad)"><i style="width:${c/tmx*100}%"></i></div><span class="mono">${c}</span></div>`).join(''):'<p class="muted">No te falta ninguna skill reconocida.</p>'}</div>
   <div class="panel"><h3>Lo que más piden</h3><p class="small muted" style="margin:2px 0 8px">Verde: ya lo tenés · rojo: te falta</p>${req.map(([k,c])=>`<div class="hrow"><span title="${esc(k)}">${esc(k)}</span><div class="bar" style="--c:var(--${have[k]?'ok':'bad'})"><i style="width:${c/req[0][1]*100}%"></i></div><span class="mono">${c}</span></div>`).join('')}</div>
  </div>`;
}

  }
  ui.busy=null;if(ui.openId===id)renderDrawer();
}

/* CV en PDF: el texto se extrae en el navegador con pdf.js (merge sobre 1793129001-b100) */
let pdfjsP=null;
const PDFJS_V='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(pdfjsP)return pdfjsP;
  pdfjsP=new Promise((ok,ko)=>{
    const s=document.createElement('script');s.src=PDFJS_V+'pdf.min.js';
    s.onload=async()=>{const lib=window.pdfjsLib;
      try{const r=await fetch(PDFJS_V+'pdf.worker.min.js');const b=await r.blob();lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b)}
      catch(e){lib.GlobalWorkerOptions.workerSrc=PDFJS_V+'pdf.worker.min.js'}
      ok(lib)};
    s.onerror=()=>ko(new Error('pdfjs'));
    document.head.appendChild(s)});
  pdfjsP.catch(()=>{pdfjsP=null});
  return pdfjsP}
async function cvFromPdf(file){
  toast('Leyendo el PDF…');
  try{
    const lib=await loadPdfJs();
    const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
    let out='';
    for(let i=1;i<=Math.min(pdf.numPages,15);i++){
      const tc=await (await pdf.getPage(i)).getTextContent();let lastY=null,line='';
      for(const it of tc.items){
        const y=it.transform?it.transform[5]:null;
        if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2){out+=line.trim()+'\n';line=''}
        line+=it.str;if(it.hasEOL){out+=line.trim()+'\n';line=''}
        if(y!==null)lastY=y}
      out+=line.trim()+'\n\n'}
    out=out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    if(out.length<40){toast('No pude leer texto en este PDF (parece una imagen escaneada). Pegá el texto a mano.');return}
    state.profile.cv=out;syncName();saveNow();render();toast('CV cargado desde el PDF. Revisá que el texto haya quedado bien.');
  }catch(e){toast('No se pudo leer el PDF. Probá de nuevo o pegá el texto.')}
}

function setApp(a,path,val){
  if(path.startsWith('pre:')){const[,k,f]=path.split(':');a.pre=a.pre||{};(a.pre[k]=a.pre[k]||{})[f]=val;return}
  if(path.startsWith('ent:')){const[,id,f]=path.split(':');const e=(a.entrevistas||[]).find(x=>x.id===id);if(e)e[f]=val;return}
  if(path.startsWith('ficha.')){a.ficha=a.ficha||{};a.ficha[path.slice(6)]=val}else a[path]=val;
}

    if(t.dataset.p==='cv'){syncName();const ni=$('[data-p="name"]');if(ni&&ni!==t)ni.value=state.profile.name;renderTabs()}

  else if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(String(r.result));if(!s||!Array.isArray(s.apps))throw 0;hydrate(s);syncName();saveNow();render();toast('Copia restaurada')}catch(x){toast('El archivo no es una copia válida')}};r.readAsText(t.files[0])}
